<!doctype html>
<html lang="zh-CN">
<head>
<style id="minem-embedded-preview-style">
  #minem-page-tools, .page-pill, .slide-controls, .slide-navigation,
  .slide-nav, .deck-controls, .deck-navigation, .presentation-controls,
  [data-minem-page-tools], [data-slide-navigation], [data-deck-navigation] {
    display: none !important;
  }
  /* Let the platform canvas own the embedding viewport so source pages are
     not letterboxed a second time inside the report viewer. */
  html, body { width: 100% !important; height: 100% !important; }
  .material-control-stage {
    width: 100vw !important;
    height: 100vh !important;
    max-width: none !important;
    max-height: none !important;
    --fs-scale: 1 !important;
  }
</style>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="minem-page" content="single-slide" />
  <title>几张表格，变成团队的业务系统</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
    body{display:grid;place-items:center;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}
    .stage{position:relative;width:1920px;height:1080px;overflow:hidden;color:#fff;background:#000;transform-origin:center}
    .stage::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,#32d7be,#3c8cf5,#8154ee)}
    h1{position:absolute;left:72px;top:66px;margin:0;font-size:52px;line-height:1.2;font-weight:800;letter-spacing:.5px;white-space:nowrap}
    .copy{position:absolute;left:72px;top:238px;width:615px}
    .pill{display:inline-flex;align-items:center;height:43px;padding:0 18px;border:1px solid #49d7a5;border-radius:999px;background:rgba(40,177,128,.16);color:#fff;font-size:23px;font-weight:700}
    .desc{margin:26px 0 18px;font-size:27px;line-height:1.55;font-weight:600;color:#f7f8fb}
    .steps{margin:0;padding:0;list-style:none;border-top:1px solid #252525}
    .steps li{height:108px;display:flex;align-items:center;gap:24px;border-bottom:1px solid #252525}
    .num{width:46px;height:46px;flex:0 0 46px;display:grid;place-items:center;border-radius:50%;background:#0d2d24;color:#43e2aa;font-size:22px;font-weight:800}
    .steps strong{display:block;font-size:25px;line-height:1.25}
    .steps p{margin:6px 0 0;color:#d2d8e2;font-size:23px;line-height:1.3}
    .outcome{position:absolute;left:72px;top:880px;width:615px;min-height:112px;padding:17px 24px;border-left:4px solid #4de2ab;border-radius:0 15px 15px 0;background:linear-gradient(90deg,rgba(25,68,53,.5),rgba(23,23,23,.65))}
    .outcome span{display:block;margin-bottom:7px;color:#43e2aa;font-size:23px;font-weight:750}
    .outcome p{margin:0;color:#f5f7fa;font-size:22px;line-height:1.45;font-weight:600}
    .video-frame{position:absolute;left:729px;top:229px;width:1119px;height:765px;overflow:hidden;border-radius:18px;background:#111;box-shadow:0 26px 70px rgba(0,0,0,.38);cursor:pointer;isolation:isolate}
    .poster{position:absolute;inset:0;background-image:url('assets/original-page.png');background-repeat:no-repeat;background-size:1920px 1080px;background-position:-729px -229px;transition:opacity .22s ease;z-index:1}
    video{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain;background:#050505;opacity:0;transition:opacity .22s ease;z-index:2}
    .play{position:absolute;left:50%;top:50%;width:112px;height:112px;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.78);border-radius:50%;background:rgba(0,0,0,.58);box-shadow:0 18px 54px rgba(0,0,0,.4);display:grid;place-items:center;z-index:4;transition:opacity .18s ease,transform .18s ease}
    .play::before{content:"";display:block;margin-left:8px;border-left:35px solid #fff;border-top:23px solid transparent;border-bottom:23px solid transparent}
    .hint{position:absolute;left:50%;top:calc(50% + 78px);transform:translateX(-50%);padding:9px 18px;border-radius:999px;background:rgba(0,0,0,.62);color:#fff;font-size:19px;font-weight:650;z-index:4;white-space:nowrap;transition:opacity .18s ease}
    .video-frame.started .poster{opacity:0}
    .video-frame.started video{opacity:1}
    .video-frame.playing .play,.video-frame.playing .hint{opacity:0;pointer-events:none}
    .video-frame.paused .play{width:76px;height:76px;opacity:1}
    .video-frame.paused .play::before{border-left-width:24px;border-top-width:16px;border-bottom-width:16px}
    .video-frame.paused .hint{top:calc(50% + 56px);opacity:1;font-size:17px}
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="几张表格，变成团队的业务系统">
    <h1>几张表格，变成团队的业务系统</h1>
    <section class="copy" aria-label="场景价值说明">
      <span class="pill">系统构建</span>
      <p class="desc">将散落在多张表格里的记录，组织成可协同、可追踪、可持续迭代的一体化应用。</p>
      <ol class="steps">
        <li><span class="num">01</span><div><strong>读懂表格</strong><p>识别业务对象、字段与关联关系</p></div></li>
        <li><span class="num">02</span><div><strong>生成系统</strong><p>建立看板、录入、编辑与复盘流程</p></div></li>
        <li><span class="num">03</span><div><strong>团队共用</strong><p>通过链接与权限统一协作口径</p></div></li>
      </ol>
    </section>
    <div class="outcome"><span>高价值结果</span><p>数据不再只是记录，而是团队协同与业务推进的共同底座</p></div>
    <section class="video-frame" id="videoFrame" role="button" tabindex="0" aria-label="点击播放几张表格生成业务系统的视频">
      <div class="poster"></div>
      <video id="demoVideo" preload="metadata" playsinline>
        <source src="assets/tables-to-system.mp4" type="video/mp4" />
      </video>
      <div class="play" aria-hidden="true"></div>
      <div class="hint">点击播放视频</div>
    </section>
  </main>
  <script>
    const stage=document.getElementById('stage');
    const frame=document.getElementById('videoFrame');
    const video=document.getElementById('demoVideo');
    function fit(){stage.style.transform=`scale(${Math.min(innerWidth/1920,innerHeight/1080)})`}
    function toggle(){
      frame.classList.add('started');
      if(video.paused){video.play().then(()=>{frame.classList.add('playing');frame.classList.remove('paused')}).catch(()=>{})}
      else{video.pause();frame.classList.remove('playing');frame.classList.add('paused')}
    }
    frame.addEventListener('click',toggle);
    frame.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});
    video.addEventListener('ended',()=>{frame.classList.remove('playing');frame.classList.add('paused')});
    addEventListener('resize',fit,{passive:true});fit();
  </script>
</body>
</html>
